services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bia
      POSTGRES_PASSWORD: bia
      POSTGRES_DB: bia_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bia -d bia_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dentro de la red de compose el host de la base de datos es `postgres`.
      DATABASE_URL: postgresql://bia:bia@postgres:5432/bia_dev
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      # Autenticación (better-auth): secreto requerido, URL base con default local.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Credenciales del admin sembrado (opcional; defaults documentados).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      PORT: 3000
    ports:
      - "3000:3000"
    # Contrato seed-on-start: aplicar migraciones, sembrar idempotentemente, luego arrancar.
    command: sh -c "bunx prisma migrate deploy && bun prisma/seed.ts && bun src/server.ts"

volumes:
  postgres-data: