services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bia
      POSTGRES_PASSWORD: bia
      POSTGRES_DB: bia_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bia -d bia_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the compose network the database host is `postgres`.
      DATABASE_URL: postgresql://bia:bia@postgres:5432/bia_dev
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      PORT: 3000
    ports:
      - "3000:3000"
    # Seed-on-start contract: apply migrations, seed idempotently, then boot.
    command: sh -c "bunx prisma migrate deploy && bun prisma/seed.ts && bun src/app.ts"

volumes:
  postgres-data: